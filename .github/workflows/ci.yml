name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (TrueAsync PHP 8.6, Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is composer.json's: the oldest Laravel 13 without a published security
        # advisory, which composer still installs. The other job is whatever composer
        # resolves today, transitive dependencies included.
        laravel: ["13.30.0", "^13.0"]
    # For the tests that need a real server behind the PDO pool (PooledLostConnectionTest);
    # without SPAWN_TEST_MYSQL_DSN they skip.
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: spawn
          MARIADB_USER: spawn
          MARIADB_PASSWORD: spawn
          MARIADB_RANDOM_ROOT_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      # The test suite needs the TrueAsync runtime (Async\spawn, coroutines, ...),
      # so it runs inside the official image. We don't use `container:` because that
      # image is PHP-only (no Node.js, which GitHub's JS actions like checkout need);
      # instead we checkout on the host and run the suite in the image via docker.
      # Image: https://github.com/true-async/releases
      - name: Run the test suite in the TrueAsync PHP image
        run: |
          docker run --rm --network host -v "$PWD":/app -w /app -e COMPOSER_ALLOW_SUPERUSER=1 \
            -e SPAWN_TEST_MYSQL_DSN='mysql:host=127.0.0.1;port=3306;dbname=spawn' \
            -e SPAWN_TEST_MYSQL_USER=spawn -e SPAWN_TEST_MYSQL_PASSWORD=spawn \
            trueasync/php-true-async:latest bash -euc '
              php -v
              php -m | grep -i async
              command -v curl >/dev/null 2>&1 || { apt-get update && apt-get install -y --no-install-recommends curl; }
              curl -sSL https://getcomposer.org/download/latest-stable/composer.phar -o /usr/local/bin/composer
              chmod +x /usr/local/bin/composer
              # PHP is 8.6; a few transitive dev deps cap at 8.5, so ignore the php
              # upper bound only (php+). The async runtime itself requires 8.6.
              composer require --no-update --no-interaction "laravel/framework:${{ matrix.laravel }}"
              composer install --no-interaction --no-progress --prefer-dist --ignore-platform-req=php+
              vendor/bin/phpunit --colors=never
            '
